name: CI

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      PORT: 8080
      UDP_PORT: 47800
      API_TIMEOUT_MS: 1500
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Smoke tests
        run: |
          node server.js &
          SERVER_PID=$!
          for i in $(seq 1 50); do
            if curl -sf http://127.0.0.1:8080/healthz >/dev/null; then break; fi
            sleep 0.2
          done
          BASE=http://127.0.0.1:8080 node test/smoke.js
          kill "$SERVER_PID"
